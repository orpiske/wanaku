---
openapi: 3.1.0
components:
  schemas:
    ActivityRecord:
      type: object
      properties:
        id:
          type: string
        lastSeen:
          $ref: "#/components/schemas/Instant"
        healthStatus:
          $ref: "#/components/schemas/HealthStatus"
        states:
          type: array
          items:
            $ref: "#/components/schemas/ServiceState"
        active:
          type: boolean
    CapabilityStatistics:
      type: object
      properties:
        total:
          type: integer
          format: int64
        healthy:
          type: integer
          format: int64
        unhealthy:
          type: integer
          format: int64
        down:
          type: integer
          format: int64
        pending:
          type: integer
          format: int64
    CodeExecutionError:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        taskId:
          type: string
        timestamp:
          type: integer
          format: int64
        details:
          type: object
          additionalProperties:
            type: string
    CodeExecutionRequest:
      type: object
      properties:
        code:
          type: string
        timeout:
          type: integer
          format: int64
        environment:
          type: object
          additionalProperties:
            type: string
        arguments:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: {}
    CodeExecutionResponse:
      type: object
      properties:
        taskId:
          type: string
        streamUrl:
          type: string
        status:
          $ref: "#/components/schemas/CodeExecutionStatus"
        submittedAt:
          type: integer
          format: int64
    CodeExecutionStatus:
      type: string
      enum:
      - PENDING
      - RUNNING
      - COMPLETED
      - FAILED
      - CANCELLED
      - TIMEOUT
    DataStore:
      type: object
      properties:
        labels:
          type: object
          additionalProperties:
            type: string
        id:
          type: string
        name:
          type: string
        data:
          type: string
    DeploymentInstructions:
      type: object
      properties:
        catalogName:
          type: string
        catalogType:
          type: string
        deploymentModel:
          type: string
        systems:
          type: array
          items:
            $ref: "#/components/schemas/SystemInstruction"
        placeholders:
          type: array
          items:
            $ref: "#/components/schemas/PlaceholderDefinition"
    FleetStatus:
      type: object
      properties:
        total:
          type: integer
          format: int32
        healthy:
          type: integer
          format: int32
        warning:
          type: integer
          format: int32
        down:
          type: integer
          format: int32
        overall:
          type: string
    HealthStatus:
      type: string
      enum:
      - PENDING
      - HEALTHY
      - UNHEALTHY
      - DOWN
    InputSchema:
      type: object
      properties:
        type:
          type: string
        properties:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Property"
        required:
          type: array
          items:
            type: string
    Instant:
      type: string
      format: date-time
      examples:
      - 2022-03-10T16:15:50Z
    MediaType:
      type: object
      properties:
        type:
          type: string
        subtype:
          type: string
        parameters:
          type: object
          additionalProperties:
            type: string
        hash:
          type: integer
          format: int32
        wildcardType:
          type: boolean
        wildcardSubtype:
          type: boolean
    OutboundSseEvent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        comment:
          type: string
        reconnectDelay:
          type: integer
          format: int64
        reconnectDelaySet:
          type: boolean
        type:
          type: object
        genericType:
          type: object
        mediaType:
          $ref: "#/components/schemas/MediaType"
        data: {}
    PlaceholderDefinition:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        description:
          type: string
        defaultValue:
          type: string
        type:
          type: string
    Property:
      type: object
      properties:
        type:
          type: string
        description:
          type: string
        target:
          type: string
        scope:
          type: string
        value:
          type: string
    ServerInfo:
      type: object
      properties:
        version:
          type: string
    ServiceState:
      type: object
      properties:
        timestamp:
          $ref: "#/components/schemas/Instant"
        healthy:
          type: boolean
        healthStatus:
          $ref: "#/components/schemas/HealthStatus"
        reason:
          type: string
    ServiceTarget:
      type: object
      properties:
        id:
          type: string
        serviceName:
          type: string
        host:
          type: string
        port:
          type: integer
          format: int32
        serviceType:
          type: string
        serviceSubType:
          type: string
        languageName:
          type: string
        languageType:
          type: string
        languageSubType:
          type: string
    StaleCapabilityInfo:
      type: object
      properties:
        id:
          type: string
        serviceName:
          type: string
        serviceType:
          type: string
        host:
          type: string
        port:
          type: integer
          format: int32
        healthStatus:
          type: string
        lastSeen:
          $ref: "#/components/schemas/Instant"
    SystemInstruction:
      type: object
      properties:
        systemName:
          type: string
        instruction:
          type: string
        format:
          type: string
    SystemStatistics:
      type: object
      properties:
        serviceCatalogsCount:
          type: integer
          format: int64
        serviceTemplatesCount:
          type: integer
          format: int64
        toolsetReposCount:
          type: integer
          format: int64
        dataStoresCount:
          type: integer
          format: int64
        toolCapabilities:
          $ref: "#/components/schemas/CapabilityStatistics"
        resourceCapabilities:
          $ref: "#/components/schemas/CapabilityStatistics"
    TemplateInstantiationRequest:
      type: object
      properties:
        templateName:
          type: string
        properties:
          type: object
          additionalProperties:
            type: string
        serviceName:
          type: string
        serviceSystem:
          type: string
    ToolCallRecord:
      type: object
      properties:
        id:
          type: string
        eventId:
          type: string
        eventType:
          type: string
        timestamp:
          type: integer
          format: int64
        toolName:
          type: string
        toolType:
          type: string
        connectionId:
          type: string
        serviceId:
          type: string
        serviceAddress:
          type: string
        error:
          type: boolean
        duration:
          type: integer
          format: int64
        errorCategory:
          type: string
        errorMessage:
          type: string
        argumentKeys:
          type: string
    ToolReference:
      type: object
      properties:
        labels:
          type: object
          additionalProperties:
            type: string
        id:
          type: string
        name:
          type: string
        description:
          type: string
        uri:
          type: string
        type:
          type: string
        inputSchema:
          $ref: "#/components/schemas/InputSchema"
        namespace:
          type: string
        configurationURI:
          type: string
        secretsURI:
          type: string
    WanakuError:
      type: object
      properties:
        message:
          type: string
    WanakuResponse:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/WanakuError"
        data: {}
    WanakuResponseDataStore:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/WanakuError"
        data:
          $ref: "#/components/schemas/DataStore"
    WanakuResponseDeploymentInstructions:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/WanakuError"
        data:
          $ref: "#/components/schemas/DeploymentInstructions"
    WanakuResponseFleetStatus:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/WanakuError"
        data:
          $ref: "#/components/schemas/FleetStatus"
    WanakuResponseInteger:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/WanakuError"
        data:
          type: integer
          format: int32
    WanakuResponseListDataStore:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/WanakuError"
        data:
          type: array
          items:
            $ref: "#/components/schemas/DataStore"
    WanakuResponseListMapStringObject:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/WanakuError"
        data:
          type: array
          items:
            type: object
            additionalProperties: {}
    WanakuResponseListMapStringString:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/WanakuError"
        data:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
    WanakuResponseListServiceTarget:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/WanakuError"
        data:
          type: array
          items:
            $ref: "#/components/schemas/ServiceTarget"
    WanakuResponseListStaleCapabilityInfo:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/WanakuError"
        data:
          type: array
          items:
            $ref: "#/components/schemas/StaleCapabilityInfo"
    WanakuResponseListToolCallRecord:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/WanakuError"
        data:
          type: array
          items:
            $ref: "#/components/schemas/ToolCallRecord"
    WanakuResponseListToolReference:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/WanakuError"
        data:
          type: array
          items:
            $ref: "#/components/schemas/ToolReference"
    WanakuResponseMapStringListActivityRecord:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/WanakuError"
        data:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/ActivityRecord"
    WanakuResponseMapStringMapStringString:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/WanakuError"
        data:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
    WanakuResponseMapStringObject:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/WanakuError"
        data:
          type: object
          additionalProperties: {}
    WanakuResponseMapStringString:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/WanakuError"
        data:
          type: object
          additionalProperties:
            type: string
    WanakuResponseServerInfo:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/WanakuError"
        data:
          $ref: "#/components/schemas/ServerInfo"
    WanakuResponseSystemStatistics:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/WanakuError"
        data:
          $ref: "#/components/schemas/SystemStatistics"
    WanakuResponseToolCallRecord:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/WanakuError"
        data:
          $ref: "#/components/schemas/ToolCallRecord"
    WanakuResponseVoid:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/WanakuError"
        data: {}
paths:
  /api/v1/capabilities:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WanakuResponseListServiceTarget"
      summary: List
      tags:
      - Capabilities Resource
  /api/v1/capabilities/fleet/status:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WanakuResponseFleetStatus"
      summary: Fleet Status
      tags:
      - Capabilities Resource
  /api/v1/capabilities/notifications:
    get:
      responses:
        "200":
          description: OK
          content:
            text/event-stream:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OutboundSseEvent"
      summary: Targets Event Stream
      tags:
      - Capabilities Resource
  /api/v1/capabilities/resources/state:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WanakuResponseMapStringListActivityRecord"
      summary: Resources State
      tags:
      - Capabilities Resource
  /api/v1/capabilities/stale:
    get:
      parameters:
      - name: inactiveOnly
        in: query
        schema:
          type: boolean
      - name: maxAgeSeconds
        in: query
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WanakuResponseListStaleCapabilityInfo"
      summary: List Stale
      tags:
      - Capabilities Resource
    delete:
      parameters:
      - name: inactiveOnly
        in: query
        schema:
          type: boolean
      - name: maxAgeSeconds
        in: query
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WanakuResponseInteger"
      summary: Cleanup Stale
      tags:
      - Capabilities Resource
  /api/v1/capabilities/tools/state:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WanakuResponseMapStringListActivityRecord"
      summary: Tools State
      tags:
      - Capabilities Resource
  /api/v1/chat/completions:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: string
        required: true
      responses:
        "200":
          description: OK
          content:
            text/plain: {}
      summary: Code Completions
      tags:
      - Llm Chat Resource
  /api/v1/chat/llms:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
      summary: Get Allowed Llms
      tags:
      - Llm Chat Resource
  /api/v1/chat/{llm}/models:
    get:
      parameters:
      - name: llm
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      summary: Get Model Suggestions
      tags:
      - Llm Chat Resource
  /api/v1/data-store:
    put:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataStore"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WanakuResponseVoid"
        "400":
          description: Bad Request
      summary: Update
      tags:
      - Data Stores Resource
    delete:
      parameters:
      - name: name
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WanakuResponseVoid"
      summary: Remove By Name
      tags:
      - Data Stores Resource
    get:
      parameters:
      - name: labelFilter
        in: query
        schema:
          type: string
      - name: name
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WanakuResponseListDataStore"
      summary: List Or Get By Name
      tags:
      - Data Stores Resource
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataStore"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WanakuResponseDataStore"
        "400":
          description: Bad Request
      summary: Add
      tags:
      - Data Stores Resource
  /api/v1/data-store/labels:
    delete:
      parameters:
      - name: labelExpression
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WanakuResponseInteger"
      summary: Remove If
      tags:
      - Data Stores Resource
  /api/v1/data-store/{id}:
    delete:
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WanakuResponseVoid"
      summary: Remove By Id
      tags:
      - Data Stores Resource
    get:
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WanakuResponseDataStore"
      summary: Get By Id
      tags:
      - Data Stores Resource
  /api/v1/management/info/version:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WanakuResponseServerInfo"
      summary: Version
      tags:
      - Info Resource
  /api/v1/management/statistics:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WanakuResponseSystemStatistics"
      summary: Get Statistics
      tags:
      - Statistics Resource
  /api/v1/service-catalog:
    get:
      parameters:
      - name: search
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WanakuResponseListMapStringObject"
      summary: List
      tags:
      - Service Catalog Resource
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataStore"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WanakuResponseDataStore"
        "400":
          description: Bad Request
      summary: Deploy
      tags:
      - Service Catalog Resource
  /api/v1/service-catalog/download:
    get:
      parameters:
      - name: name
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WanakuResponseDataStore"
      summary: Download
      tags:
      - Service Catalog Resource
  /api/v1/service-catalog/instructions:
    get:
      parameters:
      - name: model
        in: query
        schema:
          type: string
      - name: name
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WanakuResponseDeploymentInstructions"
      summary: Get Deployment Instructions
      tags:
      - Service Catalog Resource
  /api/v1/service-catalog/{name}:
    delete:
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WanakuResponseVoid"
      summary: Remove
      tags:
      - Service Catalog Resource
    get:
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WanakuResponseMapStringObject"
      summary: Get
      tags:
      - Service Catalog Resource
  /api/v1/service-template/deploy:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataStore"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WanakuResponseDataStore"
        "400":
          description: Bad Request
      summary: Deploy
      tags:
      - Service Template Resource
  /api/v1/service-template/download:
    get:
      parameters:
      - name: name
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WanakuResponseDataStore"
      summary: Download
      tags:
      - Service Template Resource
  /api/v1/service-template/get:
    get:
      parameters:
      - name: name
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WanakuResponseMapStringObject"
      summary: Get
      tags:
      - Service Template Resource
  /api/v1/service-template/instantiate:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateInstantiationRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WanakuResponseDataStore"
        "400":
          description: Bad Request
      summary: Instantiate
      tags:
      - Service Template Resource
  /api/v1/service-template/list:
    get:
      parameters:
      - name: search
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WanakuResponseListMapStringObject"
      summary: List
      tags:
      - Service Template Resource
  /api/v1/service-template/properties:
    get:
      parameters:
      - name: name
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WanakuResponseMapStringMapStringString"
      summary: Get Properties
      tags:
      - Service Template Resource
  /api/v1/service-template/remove:
    delete:
      parameters:
      - name: name
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WanakuResponseVoid"
      summary: Remove
      tags:
      - Service Template Resource
  /api/v1/toolset-repos:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WanakuResponseListMapStringString"
      summary: List
      tags:
      - Toolset Repos Resource
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WanakuResponseMapStringString"
        "400":
          description: Bad Request
      summary: Add
      tags:
      - Toolset Repos Resource
  /api/v1/toolset-repos/{name}:
    put:
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WanakuResponseMapStringString"
        "400":
          description: Bad Request
      summary: Update
      tags:
      - Toolset Repos Resource
    delete:
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
